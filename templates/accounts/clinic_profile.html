{% extends "base.html" %}{% block title %}Clinic Profile | WellPoint{% endblock %}{% block content %}<main class="page-container" style="max-width:760px;padding:40px 30px;"><section class="content-card"><div class="card-heading"><div class="heading-icon"><i class="fa-solid fa-hospital"></i></div><h2>Clinic Profile</h2></div><form method="post">{% csrf_token %}<div class="form-group"><label>Clinic Name</label><input class="form-control" name="clinic_name" value="{{ clinic.clinic_name }}" required></div><div class="form-group"><label>Address</label><textarea class="form-control" name="address" required>{{ clinic.address }}</textarea></div><div class="form-group"><label>Contact Number</label><input class="form-control" name="contact_number" value="{{ clinic.contact_number }}" required></div><p><strong>City:</strong> {{ clinic.city.city_name }}</p><button class="book-now-btn" type="submit">Save Changes</button></form></section></main>{% endblock %}
